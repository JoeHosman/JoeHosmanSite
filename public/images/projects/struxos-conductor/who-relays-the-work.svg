<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 616" role="img" aria-labelledby="t d">
  <title id="t">Who relayed the work in each era</title>
  <desc id="d">Three stages. Late May: Claude's review findings go to me and I paste them into Codex as prompts. Mid-June: a loop script prompts a fresh Pi session, which reads and updates control documents I write. Late June: I write the plan, Conductor sends one task to a Codex or Claude worker, receives a diff, and merges to main only if the gate is green.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#626657"/>
    </marker>
  </defs>
  <rect width="560" height="616" fill="#f2eee5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="17" font-weight="bold" fill="#30372d">
      <text x="20" y="28">1  Late May: I am the relay</text>
      <text x="20" y="238">2  Mid-June: a script is the relay</text>
      <text x="20" y="448">3  Late June: the harness is the relay</text>
    </g>
    <g stroke="#c5c5b7" stroke-width="1">
      <line x1="20" y1="206" x2="540" y2="206"/>
      <line x1="20" y1="416" x2="540" y2="416"/>
    </g>
    <g fill="#fbf9f4" stroke="#c5c5b7" stroke-width="1.5">
      <rect x="20" y="48" width="130" height="56" rx="6"/>
      <rect x="215" y="48" width="130" height="56" rx="6" stroke="#7d492e"/>
      <rect x="410" y="48" width="130" height="56" rx="6"/>
      <rect x="410" y="142" width="130" height="40" rx="6"/>
      <rect x="20" y="258" width="130" height="56" rx="6"/>
      <rect x="215" y="258" width="130" height="56" rx="6"/>
      <rect x="410" y="258" width="130" height="56" rx="6"/>
      <rect x="20" y="352" width="130" height="40" rx="6" stroke="#7d492e"/>
      <rect x="215" y="352" width="130" height="40" rx="6"/>
      <rect x="20" y="468" width="130" height="56" rx="6" stroke="#7d492e"/>
      <rect x="215" y="468" width="130" height="56" rx="6"/>
      <rect x="410" y="468" width="130" height="56" rx="6"/>
      <rect x="215" y="562" width="130" height="40" rx="6"/>
    </g>
    <g stroke="#626657" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <line x1="150" y1="78" x2="213" y2="78"/>
      <line x1="345" y1="78" x2="408" y2="78"/>
      <line x1="475" y1="104" x2="475" y2="140"/>
      <line x1="150" y1="288" x2="213" y2="288"/>
      <line x1="345" y1="288" x2="408" y2="288"/>
      <line x1="262" y1="350" x2="262" y2="316"/>
      <line x1="298" y1="316" x2="298" y2="350"/>
      <line x1="150" y1="372" x2="213" y2="372"/>
      <line x1="150" y1="496" x2="213" y2="496"/>
      <line x1="345" y1="484" x2="408" y2="484"/>
      <line x1="408" y1="508" x2="347" y2="508"/>
      <line x1="280" y1="524" x2="280" y2="560"/>
    </g>
    <g font-size="13" fill="#626657" text-anchor="middle">
      <text x="181" y="70">findings</text>
      <text x="376" y="70">prompts</text>
      <text x="181" y="280">prompts</text>
      <text x="376" y="280">commits</text>
      <text x="181" y="364">writes</text>
      <text x="181" y="488">plan</text>
      <text x="376" y="476">task</text>
      <text x="376" y="524">diff</text>
    </g>
    <g font-size="13" fill="#626657">
      <text x="485" y="127">commits</text>
      <text x="254" y="338" text-anchor="end">reads</text>
      <text x="306" y="338">updates</text>
      <text x="290" y="547">only if green</text>
    </g>
    <g font-size="16" font-weight="bold" fill="#30372d" text-anchor="middle">
      <text x="85" y="72">Claude</text>
      <text x="280" y="72" fill="#7d492e">Me</text>
      <text x="475" y="72">Codex</text>
      <text x="475" y="168">main</text>
      <text x="85" y="282">Loop script</text>
      <text x="280" y="282">Pi</text>
      <text x="475" y="282">main</text>
      <text x="85" y="378" fill="#7d492e">Me</text>
      <text x="280" y="378">Control docs</text>
      <text x="85" y="492" fill="#7d492e">Me</text>
      <text x="280" y="492">Conductor</text>
      <text x="475" y="492">Worker</text>
      <text x="280" y="588">main</text>
    </g>
    <g font-size="13.5" fill="#626657" text-anchor="middle">
      <text x="85" y="94">reviews</text>
      <text x="280" y="94">copy and paste</text>
      <text x="475" y="94">builds</text>
      <text x="85" y="304">every batch</text>
      <text x="280" y="304">fresh session</text>
      <text x="475" y="304">after test script</text>
      <text x="85" y="514">goals, priorities</text>
      <text x="280" y="514">tests and merges</text>
      <text x="475" y="514">Codex or Claude</text>
    </g>
  </g>
</svg>
