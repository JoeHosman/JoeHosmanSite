<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Conductor: verified execution and durable recovery</title>
<desc id="desc">The agent edits. Conductor controls gates and merges. Held-out checks score benchmark results separately. Red main blocks dispatch and requires fresh verification to recover.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526655"/></marker></defs>
<rect width="1200" height="620" fill="#f2eee5"/>
<g font-family="Arial, sans-serif" fill="#30372d">
<text x="42" y="52" font-size="26">The agent edits. The harness decides what lands.</text>
<text x="42" y="88" font-size="18" fill="#626657">Boundaries checked with real Git operations, gates, and durable event receipts.</text>
<g fill="#e0e4d8" stroke="#8c9c88" stroke-width="2">
<rect x="42" y="140" width="170" height="94" rx="6"/><rect x="259" y="140" width="216" height="94" rx="6"/>
<rect x="522" y="140" width="192" height="94" rx="6"/><rect x="761" y="140" width="195" height="94" rx="6"/>
<rect x="1003" y="140" width="155" height="94" rx="6"/>
</g>
<g font-size="22" text-anchor="middle">
<text x="127" y="178">Fixed task</text><text x="127" y="208" font-size="17">requirements</text>
<text x="367" y="178">Agent worktree</text><text x="367" y="208" font-size="17">isolated edits</text>
<text x="618" y="178">Visible gate</text><text x="618" y="208" font-size="17">reject or repair</text>
<text x="858" y="178">Merge + verify</text><text x="858" y="208" font-size="17">harness-owned</text>
<text x="1080" y="178">Main</text><text x="1080" y="208" font-size="17">advance on green</text>
</g>
<g stroke="#526655" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M212 187H252"/><path d="M475 187H515"/><path d="M714 187H754"/><path d="M956 187H996"/>
<path d="M618 234V279H367V241"/><path d="M1080 234V302"/>
</g>
<text x="459" y="304" font-size="17">failed check + diff</text>
<rect x="798" y="314" width="360" height="92" rx="6" fill="#e8e3d6" stroke="#a99a7f"/>
<text x="978" y="351" text-anchor="middle" font-size="21">Independent benchmark scoring</text>
<text x="978" y="381" text-anchor="middle" font-size="17">held-out contract + regression checks</text>
<line x1="42" y1="445" x2="1158" y2="445" stroke="#c5c5b7"/>
<text x="42" y="484" font-size="21" fill="#7d492e">When main turns red</text>
<g font-size="19"><text x="42" y="529">Persist stop + local alert</text><text x="386" y="529">Block dispatch across restart</text><text x="793" y="529">Explicit fresh verification</text></g>
<g stroke="#526655" stroke-width="2" marker-end="url(#arrow)"><line x1="279" y1="522" x2="367" y2="522"/><line x1="676" y1="522" x2="775" y2="522"/></g>
<text x="42" y="580" font-size="17" fill="#626657">Recovery clears the stop only after the gate passes and the main commit remains unchanged.</text>
</g></svg>
