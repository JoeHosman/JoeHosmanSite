<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" role="img" aria-labelledby="t d">
  <title id="t">From review finding to ratchet</title>
  <desc id="d">Six steps: an adversarial persona review; a finding that must cite a file, line range, and verification command, or be discarded; a todo epic; an agent slice that extracts one responsibility and deletes the old copy; a ratchet test asserting the responsibility stays out; and the merge gate running that test on every later change. If a later change moves the logic back, the gate turns red and the change is rejected.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#626657"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#7d492e"/>
    </marker>
  </defs>
  <rect width="560" height="590" fill="#f2eee5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#fbf9f4" stroke="#c5c5b7" stroke-width="1.5">
      <rect x="20" y="20" width="450" height="66" rx="6"/>
      <rect x="20" y="114" width="450" height="66" rx="6"/>
      <rect x="20" y="208" width="450" height="66" rx="6"/>
      <rect x="20" y="302" width="450" height="66" rx="6"/>
      <rect x="20" y="396" width="450" height="66" rx="6"/>
      <rect x="20" y="490" width="450" height="66" rx="6" stroke="#7d492e"/>
    </g>
    <g stroke="#626657" stroke-width="1.5" marker-end="url(#a)">
      <line x1="245" y1="86" x2="245" y2="112"/>
      <line x1="245" y1="180" x2="245" y2="206"/>
      <line x1="245" y1="274" x2="245" y2="300"/>
      <line x1="245" y1="368" x2="245" y2="394"/>
      <line x1="245" y1="462" x2="245" y2="488"/>
    </g>
    <polyline points="470,523 512,523 512,335 472,335" fill="none" stroke="#7d492e" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="530" y="429" font-size="14" fill="#7d492e" transform="rotate(90 530 429)" text-anchor="middle">moves logic back: rejected</text>
    <g font-size="17" font-weight="bold" fill="#30372d">
      <text x="38" y="47">1  Adversarial review</text>
      <text x="38" y="141">2  Finding with receipts</text>
      <text x="38" y="235">3  Todo epic</text>
      <text x="38" y="329">4  Agent slice</text>
      <text x="38" y="423">5  Ratchet test</text>
      <text x="38" y="517">6  Merge gate</text>
    </g>
    <g font-size="14.5" fill="#626657">
      <text x="38" y="70">"Uncle Bob" persona; eight agents in parallel</text>
      <text x="38" y="164">File, line range, and command, or it is discarded</text>
      <text x="38" y="258">Example: move readiness commands out</text>
      <text x="38" y="352">Extract one responsibility, delete the old copy</text>
      <text x="38" y="446">Asserts the responsibility stays out</text>
      <text x="38" y="540">Runs the ratchet on every later change</text>
    </g>
  </g>
</svg>
