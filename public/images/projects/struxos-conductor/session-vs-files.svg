<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="t d">
  <title id="t">Where the loop kept its state</title>
  <desc id="d">Before: one long Pi session kept alive by an Expect script typing continue; the goal and history pile up in the context until they are compacted, so the state lives in the conversation and a crash or compaction loses it. After: each batch is a fresh session that reads and then updates control documents in the repository, so the state lives in files and any batch can fail without losing it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#626657"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#f2eee5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="17" font-weight="bold" fill="#30372d">
      <text x="20" y="26">Before: one long session</text>
      <text x="295" y="26">After: fresh session per batch</text>
    </g>
    <line x1="280" y1="12" x2="280" y2="326" stroke="#c5c5b7"/>
    <rect x="20" y="78" width="240" height="190" rx="6" fill="#fbf9f4" stroke="#c5c5b7" stroke-width="1.5"/>
    <text x="140" y="100" font-size="16" font-weight="bold" fill="#30372d" text-anchor="middle">Pi session context</text>
    <g fill="#e6e1d4" stroke="#c5c5b7">
      <rect x="40" y="226" width="200" height="30"/>
      <rect x="40" y="190" width="200" height="30"/>
      <rect x="40" y="154" width="200" height="30"/>
      <rect x="40" y="118" width="200" height="30" fill="#fbf9f4" stroke="#7d492e" stroke-dasharray="5 4"/>
    </g>
    <g font-size="13.5" fill="#30372d" text-anchor="middle">
      <text x="140" y="246">goal and rules</text>
      <text x="140" y="210">turns 1 to 40</text>
      <text x="140" y="174">turns 41 to 80</text>
      <text x="140" y="138" fill="#7d492e">compacted summary</text>
    </g>
    <line x1="60" y1="44" x2="60" y2="76" stroke="#626657" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="68" y="62" font-size="13" fill="#626657">Expect types "continue"</text>
    <g font-size="13.5" fill="#626657">
      <text x="20" y="296">State lives in the conversation.</text>
      <text x="20" y="316">A crash or compaction loses it.</text>
    </g>
    <rect x="295" y="44" width="245" height="78" rx="6" fill="#fbf9f4" stroke="#7d492e" stroke-width="1.5"/>
    <text x="417" y="68" font-size="16" font-weight="bold" fill="#30372d" text-anchor="middle">Control docs in repo</text>
    <text x="417" y="90" font-size="13.5" fill="#626657" text-anchor="middle">priority, stop rules,</text>
    <text x="417" y="108" font-size="13.5" fill="#626657" text-anchor="middle">slice template, todos</text>
    <g fill="#fbf9f4" stroke="#c5c5b7" stroke-width="1.5">
      <rect x="295" y="208" width="73" height="60" rx="6"/>
      <rect x="381" y="208" width="73" height="60" rx="6"/>
      <rect x="467" y="208" width="73" height="60" rx="6"/>
    </g>
    <g stroke="#626657" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
      <line x1="331" y1="124" x2="331" y2="206"/>
      <line x1="417" y1="124" x2="417" y2="206"/>
      <line x1="503" y1="124" x2="503" y2="206"/>
    </g>
    <text x="417" y="168" font-size="13" fill="#626657" text-anchor="middle" paint-order="stroke" stroke="#f2eee5" stroke-width="6">reads, then updates</text>
    <g font-size="14" font-weight="bold" fill="#30372d" text-anchor="middle">
      <text x="331" y="236">batch 1</text>
      <text x="417" y="236">batch 2</text>
      <text x="503" y="236">batch 3</text>
    </g>
    <g font-size="12.5" fill="#626657" text-anchor="middle">
      <text x="331" y="254">fresh</text>
      <text x="417" y="254">fresh</text>
      <text x="503" y="254">fresh</text>
    </g>
    <g font-size="13.5" fill="#626657">
      <text x="295" y="296">State lives in files.</text>
      <text x="295" y="316">Any batch can fail without losing it.</text>
    </g>
  </g>
</svg>
