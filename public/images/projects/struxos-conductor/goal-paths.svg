<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" role="img" aria-labelledby="t d">
  <title id="t">Two kinds of goal</title>
  <desc id="d">Top: a vague, open-ended goal leads the agent to add static cue text, which looks done in the commit log; a stop rule now blocks that path. Bottom: a goal that names a situation becomes a rule with a command, stored state, a gate, and tests, then a script that tries the situation and saves proof; the todo item closes only when all of these exist, in the same commit as the code.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#626657"/>
    </marker>
  </defs>
  <rect width="560" height="372" fill="#f2eee5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="17" font-weight="bold" fill="#30372d">
      <text x="20" y="26">A goal that text can satisfy</text>
      <text x="20" y="186">A goal that names a situation and proof</text>
    </g>
    <line x1="20" y1="156" x2="540" y2="156" stroke="#c5c5b7"/>
    <g fill="#fbf9f4" stroke="#c5c5b7" stroke-width="1.5">
      <rect x="20" y="44" width="130" height="62" rx="6"/>
      <rect x="215" y="44" width="130" height="62" rx="6"/>
      <rect x="410" y="44" width="130" height="62" rx="6" stroke-dasharray="5 4"/>
      <rect x="20" y="204" width="130" height="80" rx="6"/>
      <rect x="215" y="204" width="130" height="80" rx="6"/>
      <rect x="410" y="204" width="130" height="80" rx="6"/>
      <rect x="20" y="318" width="520" height="40" rx="6" stroke="#7d492e"/>
    </g>
    <g stroke="#626657" stroke-width="1.5" marker-end="url(#a)">
      <line x1="150" y1="75" x2="213" y2="75"/>
      <line x1="345" y1="75" x2="408" y2="75"/>
      <line x1="150" y1="244" x2="213" y2="244"/>
      <line x1="345" y1="244" x2="408" y2="244"/>
      <line x1="475" y1="284" x2="475" y2="316"/>
    </g>
    <line x1="377" y1="52" x2="377" y2="98" stroke="#7d492e" stroke-width="4"/>
    <g font-size="13" fill="#626657" text-anchor="middle">
      <text x="181" y="67">adds</text>
      <text x="181" y="236">lesson</text>
      <text x="376" y="236">scripted</text>
    </g>
    <text x="377" y="122" font-size="13" fill="#7d492e" text-anchor="middle">stop rule blocks</text>
    <text x="485" y="304" font-size="13" fill="#626657">then</text>
    <g font-size="16" font-weight="bold" fill="#30372d" text-anchor="middle">
      <text x="85" y="70">Goal</text>
      <text x="280" y="70">Static cue text</text>
      <text x="475" y="70" fill="#626657">Looks done</text>
      <text x="85" y="228">Situation</text>
      <text x="280" y="228">Rule</text>
      <text x="475" y="228">Script</text>
    </g>
    <g font-size="13.5" fill="#626657" text-anchor="middle">
      <text x="85" y="92">open-ended</text>
      <text x="280" y="92">no new behavior</text>
      <text x="475" y="92">in the commit log</text>
      <text x="85" y="250">a valve is missing</text>
      <text x="85" y="268">before shipping</text>
      <text x="280" y="250">command, state,</text>
      <text x="280" y="268">gate, and tests</text>
      <text x="475" y="250">tries the situation,</text>
      <text x="475" y="268">saves proof</text>
      <text x="280" y="343" fill="#30372d">Todo item closes only when all of these exist, in the same commit</text>
    </g>
  </g>
</svg>
