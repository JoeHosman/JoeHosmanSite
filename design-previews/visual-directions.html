  <script>
    (() => {
      const root = document.getElementById('joe-style-study');
      root.querySelector('.editorial').innerHTML = `
        <div class="profile-layout"><aside class="profile-sidebar"><div class="initials">JH.</div><h3>Joe Hosman</h3><p>Engineer. Maker.<br>Thirty years of industry experience, and plenty left to explore.</p><nav aria-label="Editorial sections"><a href="#profile-story">My story</a><a href="#career-chapters">Career &amp; experience</a><a href="#workshop-feature">In the workshop</a></nav><footer>Software. Systems.<br>Wood. Metal. Ideas.</footer></aside>
        <div class="profile-story" id="profile-story"><div class="eyebrow">A working life, in chapters</div><h2>Good work starts<br>with <em>curiosity.</em></h2><p class="lede">From process automation and machine learning to woodworking and art: a place to explore my career, the things I make, and what I learn along the way.</p>
        <div class="chapters" id="career-chapters"><div class="chapter"><span>01</span><div><h3>A career in industry</h3><p>The roles, responsibilities, and work behind thirty years of experience.</p></div><span>↗</span></div><div class="chapter"><span>02</span><div><h3>How I approach a problem</h3><p>Decisions, experiments, and lessons from professional work.</p></div><span>↗</span></div><div class="chapter"><span>03</span><div><h3>Beyond the day job</h3><p>Making room for tools, materials, and unfamiliar ideas.</p></div><span>↗</span></div></div>
        <div class="workshop-feature" id="workshop-feature"><div class="art wood" aria-hidden="true"></div><div><div class="eyebrow">From the workshop</div><h3>From sketch to sawdust</h3><p>A project story, with space for the process as well as the finished piece.</p><span class="sample-note">ILLUSTRATIVE PROJECT</span></div></div></div></div>`;
      root.querySelector('.studio').innerHTML = `
        <div class="mast"><div class="name">Joe Hosman.</div><nav class="nav" aria-label="Gallery sections"><a href="#project-wall">Projects</a><a href="#gallery-career">Career &amp; about</a></nav></div>
        <div class="gallery-heading"><h2>Things I've<br>put my <em>mind to.</em></h2><p>Thirty years in industry.<br>A continuing interest in software, machines, materials, and art.</p></div>
        <div class="filters" role="group" aria-label="Filter sample projects"><button type="button" data-filter="all" aria-pressed="true">Everything</button><button type="button" data-filter="software" aria-pressed="false">Software &amp; AI</button><button type="button" data-filter="making" aria-pressed="false">Wood &amp; machines</button><button type="button" data-filter="art" aria-pressed="false">Art</button></div>
        <div class="wall" id="project-wall"><article class="large" data-category="making"><div class="art wood" aria-hidden="true"></div><div class="tile-caption"><div class="eyebrow">Woodworking</div><h3>From sketch to sawdust</h3><span class="sample-note">ILLUSTRATIVE PROJECT</span></div></article><article data-category="art"><div class="art study" aria-hidden="true"></div><div class="tile-caption"><div class="eyebrow">Art</div><h3>Studies in form</h3><span class="sample-note">ILLUSTRATIVE PROJECT</span></div></article><article class="text-tile" data-category="software"><div class="eyebrow">Process automation</div><h3>Less repetition.<br>More possibility.</h3><p>input → transform → output</p><span class="sample-note">ILLUSTRATIVE PROJECT</span></article><article class="text-tile" data-category="software"><div class="eyebrow">Machine learning</div><h3>An experiment,<br>still unfolding.</h3><p>Question. Test. Learn. Repeat.</p><span class="sample-note">ILLUSTRATIVE PROJECT</span></article><article data-category="making"><div class="art flow" aria-hidden="true"></div><div class="tile-caption"><div class="eyebrow">Mechanical engineering</div><h3>Making things move</h3><span class="sample-note">ILLUSTRATIVE PROJECT</span></div></article></div>
        <div class="career" id="gallery-career"><strong>The person behind the projects</strong><p>30 years of industry experience →</p></div>`;
      root.querySelector('.technical').innerHTML = `
        <div class="notebook-header"><b>joe hosman / notebook</b><span>Work · experiments · observations</span></div><div class="notebook-intro"><h2>A record of making things.</h2><p>My career and projects, told as an ongoing collection of decisions, discoveries, and work in progress.</p></div>
        <div class="journal"><nav class="journal-index" aria-label="Notebook topics"><a href="#entry-latest">Latest entries</a><a href="#entry-career">Career notes</a><a href="#entry-workshop">Workshop</a><p class="sample-note">ILLUSTRATIVE ENTRIES<br>AND DATES</p></nav><div class="entries">
        <article class="entry" id="entry-latest"><div class="eyebrow">September 2026 / machine learning</div><h3>What happens if I try it another way?</h3><p>An experiment can earn its place here before it has a polished outcome. Record the question, the approach, and what changed.</p><details><summary>Open the experiment note</summary><p>This sample shows where a code example, an experiment result, and the next question would appear. Notes can be brief or grow into full project stories.</p></details></article>
        <article class="entry" id="entry-workshop"><div class="eyebrow">August 2026 / woodworking</div><div class="entry-split"><div><h3>From sketch to sawdust</h3><p>A few workshop photos, an unexpected challenge, and the lesson to take into the next build.</p></div><div class="art wood" aria-hidden="true"></div></div><details><summary>Open the workshop note</summary><p>Materials, sketches, and process photos would accompany the story here. Related updates could link back to the same project.</p></details></article>
        <article class="entry" id="entry-career"><div class="eyebrow">Career reflection / industry</div><h3>The decisions behind the work</h3><p>The professional stories: the problem, my contribution, the outcome, and what the experience taught me.</p><details><summary>Open the career note</summary><p>Career notes can connect to a concise resume page and link related work across different periods of your career.</p></details></article></div></div>`;
      const filters = root.querySelectorAll('[data-filter]');
      filters.forEach(button => button.addEventListener('click', () => {
