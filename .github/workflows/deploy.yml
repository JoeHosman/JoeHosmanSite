name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Install browser for verification
        run: npx playwright install --with-deps chromium
      - name: Verify published pages and repository links
        run: npm run test:e2e
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Verify empty collections
        run: npm run test:e2e -- --project=desktop
        env:
          E2E_EMPTY: '1'
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Build actual portfolio
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
